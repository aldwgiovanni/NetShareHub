name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Build et tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build NetShareHub.slnx -c Release --nologo

      - name: Tests
        run: dotnet test Src/NetShareHub/Tests/NetShareHub.Tests.csproj -c Release --no-build --nologo
        env:
          NSH_SCREENSHOTS: ${{ runner.temp }}/screenshots

      - name: Captures d'écran des tests d'interface
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-${{ matrix.os }}
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
